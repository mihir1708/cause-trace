name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: causetrace
          POSTGRES_PASSWORD: causetrace
          POSTGRES_DB: causetrace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U causetrace -d causetrace"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://causetrace:causetrace@localhost:5432/causetrace
      TEST_DATABASE_URL: postgresql://causetrace:causetrace@localhost:5432/causetrace_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --group ml
      - name: ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run --group ml mypy
      - name: cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-${{ hashFiles('src/causetrace/config.py') }}
      # Outside pytest: tests never download. If this fails, the slow test skips.
      - name: download retrieval models
        id: models
        continue-on-error: true
        run: make models
      - name: pytest (including the slow real-model test)
        run: uv run --group ml pytest -rs
      - name: ingest fixtures
        run: make ingest DATA=data/fixtures
      - name: index fixtures
        if: steps.models.outcome == 'success'
        run: make index
