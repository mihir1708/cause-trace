[project]
name = "causetrace"
version = "0.1.0"
description = "Predict NTSB causal findings for an aviation incident from its facts, using retrieval over earlier investigations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "fastapi>=0.143.0",
    "langgraph>=0.2",
    "openai>=1.40",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "psycopg-pool>=3.3.3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "typer>=0.27.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
causetrace = "causetrace.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]
load = [
    "locust>=2.46.7",
]
ml = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
# Pre-existing fixture builder, kept byte-for-byte as committed with the fixture.
extend-exclude = ["scripts/make_fixture.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "causetrace.*"
strict = true

# Optional `ml` dependency group; absent in a default `uv sync`.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "torch.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: runs the real retrieval models (skips when they are not cached)"]
