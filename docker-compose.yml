services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: causetrace
      POSTGRES_PASSWORD: causetrace
      POSTGRES_DB: causetrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U causetrace -d causetrace"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
